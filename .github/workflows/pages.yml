# Builds and tests ReactX, then publishes the site to GitHub Pages:
#   https://sargisis.github.io/ReactX/
# The site is pushed to the gh-pages branch; in Settings -> Pages choose
# "Deploy from a branch" -> gh-pages / (root).
name: Build, test and publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false  # never stop a publish half-way

env:
  EMSDK_VERSION: "6.0.13"  # same Emscripten as in development

jobs:
  native:
    name: Native build and tests (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      # The C++20 module is tested locally with GCC 15; CI checks the headers.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14 -DREACTX_MODULES=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  site:
    name: Web build, tests and site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the website (base /ReactX/)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset pages
          cmake --build --preset pages

      - name: Test under Node
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ctest --preset pages

      - name: Keep the site for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/pages/site
          if-no-files-found: error

  deploy:
    name: Publish to the gh-pages branch
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native, site]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # push the gh-pages branch with the built-in token
    steps:
      - name: Get the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # A fresh one-commit branch each time: only the built files, no history.
      - name: Push to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA::7}: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
