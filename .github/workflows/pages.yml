# Builds and tests ReactX (GCC 16 and Emscripten; ASan+UBSan+LSan and TSan),
# then publishes the site to GitHub Pages:
#   https://sargisis.github.io/ReactX/
# The deploy job publishes it with actions/deploy-pages (Settings -> Pages ->
# Source: GitHub Actions). Compiled files (ccache) and Emscripten are kept
# between runs, so a push usually builds only what changed.
name: Build, test and publish the site

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]  # README, CHANGELOG, AGENTS.md: not part of the build or the site
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # every night: the long fuzzing run (3 min)

permissions:
  contents: read

# The site is live after the native and web jobs (~1-2 min); the sanitizers,
# the analyzer and the CLI end-to-end run go on in parallel and turn the run
# red if they find something, but don't hold the publish back.

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false  # never stop a publish half-way

env:
  EMSDK_VERSION: "6.0.13"  # same Emscripten as in development

jobs:
  # All native jobs run in the official gcc:16 image: natively ReactX uses the
  # C++26 standard library of GCC 16 (std::inplace_vector, std::mdspan,
  # std::text_encoding, <debugging>) and C++26 contracts (-fcontracts).
  native:
    name: Native build and tests (GCC 16, C++26)
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # Compiled files from earlier runs (ReactX finds ccache by itself): only
      # what changed is compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-native-${{ github.sha }}
          restore-keys: ccache-native-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build -j && ccache -s  # hits / misses of the compiler cache
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE "slow|fuzz"  # fuzzing: the ASan job

  # The reactx CLI end to end: makes real projects and builds them (slow, so a
  # job of its own that the publish doesn't wait for).
  cli-e2e:
    name: CLI end to end
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=/" >> "$GITHUB_ENV"; echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"
          # The test projects live in new temporary folders every run: with paths
          # made relative (BASEDIR=/) and the folder left out of the hash, their
          # copies of ReactX come from the cache instead of being compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-e2e-${{ github.sha }}
          restore-keys: |
            ccache-e2e-
            ccache-native-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        # Only the test and the CLI it runs, not the examples and other tests.
        run: cmake --build build -j --target reactx_cli_tests && ccache -s
      - name: Test
        run: ctest --test-dir build --output-on-failure -R reactx_cli_e2e_tests

  # Memory errors, leaks and undefined behaviour stop the run on the first
  # finding: -fno-sanitize-recover makes UBSan fatal (by default it only
  # prints), detect_leaks turns LeakSanitizer on, halt_on_error stops ASan.
  sanitize-address:
    name: ASan + UBSan + LeakSanitizer
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
      options: --cap-add=SYS_PTRACE  # LeakSanitizer needs ptrace in a container
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # Compiled files from earlier runs (ReactX finds ccache by itself): only
      # what changed is compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j && ccache -s  # hits / misses of the compiler cache
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE "slow|fuzz"
      # Random inputs to the JSON, HTTP and URL parsers; a new seed every run.
      # A push runs the regular tests only; the night run fuzzes for 3 minutes.
      - name: Fuzz the input parsers (3 min)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cd build && ./reactx_fuzz_tests 180
      - name: Keep the input that crashed the fuzzer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: build/fuzz-crash.bin
          if-no-files-found: ignore

  # GCC's static analyzer on the code that reads untrusted input (HTTP, JSON,
  # URLs, reactx.json): any finding fails the build.
  analyze:
    name: Static analysis (gcc -fanalyzer)
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # Compiled files from earlier runs (ReactX finds ccache by itself): only
      # what changed is compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-analyze-${{ github.sha }}
          restore-keys: ccache-analyze-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DREACTX_ANALYZER=ON
          -DREACTX_BUILD_EXAMPLES=OFF -DREACTX_BUILD_TESTS=OFF -DREACTX_BUILD_TOOLS=ON
      - name: Build with the analyzer
        run: cmake --build build -j 2  # the analyzer needs a lot of memory per file

  # Data races in the HTTP server, the CLI's watcher and the tests' threads.
  sanitize-thread:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
      options: --security-opt seccomp=unconfined  # lets setarch turn off ASLR (TSan's memory layout)
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # Compiled files from earlier runs (ReactX finds ccache by itself): only
      # what changed is compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tsan-${{ github.sha }}
          restore-keys: ccache-tsan-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=thread"
      - name: Build
        run: cmake --build build -j && ccache -s  # hits / misses of the compiler cache
      - name: Test
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure -LE slow

  site:
    name: Web build, tests and site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"; echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      # Emscripten with its prebuilt system libraries, downloaded once per version.
      - name: Restore Emscripten ${{ env.EMSDK_VERSION }}
        id: emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the website (base /ReactX/)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset pages
          cmake --build --preset pages

      - name: Test under Node
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ctest --preset pages

      - name: Keep the site for the publish job
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages/site

  # Straight to GitHub Pages (Settings -> Pages -> Source: GitHub Actions):
  # no gh-pages branch and no separate "pages build and deployment" run.
  deploy:
    name: Publish to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [native, site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
