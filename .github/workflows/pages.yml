# Builds and tests ReactX, then publishes the site to GitHub Pages:
#   https://sargisis.github.io/ReactX/
# Pages must use "GitHub Actions" as the source (Settings -> Pages).
name: Build, test and publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "6.0.13"  # same Emscripten as in development

jobs:
  native:
    name: Native build and tests (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      # The C++20 module is tested locally with GCC 15; CI checks the headers.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14 -DREACTX_MODULES=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  site:
    name: Web build, tests and site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the website (base /ReactX/)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset pages
          cmake --build --preset pages

      - name: Test under Node
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ctest --preset pages

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages/site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native, site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
