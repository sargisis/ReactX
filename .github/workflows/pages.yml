# Builds and tests ReactX (GCC 16 and Emscripten; ASan+UBSan+LSan and TSan),
# then publishes the site to GitHub Pages:
#   https://sargisis.github.io/ReactX/
# The site is pushed to the gh-pages branch; in Settings -> Pages choose
# "Deploy from a branch" -> gh-pages / (root).
name: Build, test and publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false  # never stop a publish half-way

env:
  EMSDK_VERSION: "6.0.13"  # same Emscripten as in development

jobs:
  # All native jobs run in the official gcc:16 image: natively ReactX uses the
  # C++26 standard library of GCC 16 (std::inplace_vector, std::mdspan,
  # std::text_encoding, <debugging>) and C++26 contracts (-fcontracts).
  native:
    name: Native build and tests (GCC 16, C++26)
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build -j
      - name: Test (including the slow end-to-end CLI run)
        run: ctest --test-dir build --output-on-failure

  # Memory errors, leaks and undefined behaviour stop the run on the first
  # finding: -fno-sanitize-recover makes UBSan fatal (by default it only
  # prints), detect_leaks turns LeakSanitizer on, halt_on_error stops ASan.
  sanitize-address:
    name: ASan + UBSan + LeakSanitizer
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
      options: --cap-add=SYS_PTRACE  # LeakSanitizer needs ptrace in a container
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE slow

  # Data races in the HTTP server, the CLI's watcher and the tests' threads.
  sanitize-thread:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
      options: --security-opt seccomp=unconfined  # lets setarch turn off ASLR (TSan's memory layout)
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=thread"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure -LE slow

  site:
    name: Web build, tests and site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the website (base /ReactX/)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset pages
          cmake --build --preset pages

      - name: Test under Node
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ctest --preset pages

      - name: Keep the site for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/pages/site
          if-no-files-found: error

  deploy:
    name: Publish to the gh-pages branch
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native, sanitize-address, sanitize-thread, site]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # push the gh-pages branch with the built-in token
    steps:
      - name: Get the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # A fresh one-commit branch each time: only the built files, no history.
      - name: Push to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA::7}: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
