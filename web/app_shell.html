<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReactX — React на современном C++</title>
  <meta name="description" content="ReactX: UI-фреймворк в духе React на современном C++ (C++26) — терминал и браузер (WebAssembly).">
  <!-- The folder of the app (from CMake); assets and router paths are relative to it. -->
  <base href="@REACTX_WEB_BASE@">
  <link rel="icon" href="data:,">
  <!-- Start downloading the app right away, not after index.js asks for it. -->
  <link rel="preload" href="index.wasm" as="fetch" type="application/wasm" crossorigin>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1d2130; --muted: #6b7280;
      --accent: #2563eb; --accent-text: #ffffff; --border: #e5e7eb; --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117; --card: #181b24; --text: #e6e8ef; --muted: #9aa1b2;
        --accent: #4f8cff; --border: #2a2f3c; --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #app { width: 100%; max-width: 560px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; box-shadow: 0 8px 30px rgb(0 0 0 / 0.06);
    }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .grow { flex: 1; }
    .count { font-size: 3.5rem; font-weight: 700; text-align: center; margin: 8px 0 16px; font-variant-numeric: tabular-nums; }
    .demo button {
      font: inherit; padding: 8px 14px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--text);
    }
    .demo button:hover { border-color: var(--accent); }
    .demo button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .demo button.active { border-color: var(--accent); color: var(--accent); }
    .demo button.danger { color: var(--danger); }
    .demo button.icon { padding: 2px 8px; border: none; color: var(--muted); }
    .demo button.icon:hover { color: var(--danger); }
    .demo input[type="text"] {
      font: inherit; padding: 8px 12px; border-radius: 9px; width: 100%;
      border: 1px solid var(--border); background: transparent; color: var(--text);
    }
    .demo input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .demo ul { list-style: none; padding: 0; margin: 16px 0; }
    .demo li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
    .demo li.done span { color: var(--muted); text-decoration: line-through; }
    .demo li span { flex: 1; }
    .footer { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; gap: 8px; }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 16px 0 0; }
    .empty { color: var(--muted); text-align: center; padding: 16px 0; }

    /* ---- web_app layout ---- */
    body.app { display: block; padding: 0; }
    .app #app { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
    .topbar { display: flex; align-items: center; gap: 16px; padding: 18px 0; margin-bottom: 8px; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 1.1rem; margin-right: auto; color: var(--text); text-decoration: none; }
    .nav { display: flex; gap: 4px; }
    .nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; }
    .nav a:hover { color: var(--text); background: rgb(127 127 127 / 0.12); }
    .nav a.active { color: var(--accent); background: rgb(79 140 255 / 0.12); font-weight: 600; }
    .page { display: flex; flex-direction: column; gap: 16px; }
    .page h1 { margin: 0; }
    .lead { color: var(--muted); margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--card); }
    .stat b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 0.9rem; }
    .error { color: var(--danger); border: 1px solid var(--danger); border-radius: 10px; padding: 10px 14px; margin: 0; }
    .back { color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }
    .filters { display: flex; gap: 6px; }
    .filters a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 0.9rem; }
    .filters a.active { color: var(--accent); border-color: var(--accent); }
    .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.85rem; border: 1px solid var(--border); color: var(--muted); }
    .status.done { color: #16a34a; border-color: #16a34a; }
    .footer-note { margin-top: 48px; color: var(--muted); font-size: 0.85rem; text-align: center; }

  </style>
</head>
<body class="app">
  <div id="app"></div>
  {{{ SCRIPT }}}
</body>
</html>
