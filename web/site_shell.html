<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReactX — React for C++26</title>
  <meta name="description" content="ReactX: a React-like UI framework in C++26. One component code for the browser (WebAssembly) and the terminal. Components, hooks, router, no JavaScript.">
  <meta property="og:title" content="ReactX — React for C++26">
  <meta property="og:description" content="Components, hooks and a reconciler in modern C++. The same code runs in the browser (WebAssembly) and in the terminal.">
  <!-- The folder of the site (from CMake); assets and router paths are relative to it. -->
  <base href="@REACTX_WEB_BASE@">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f5a524'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%230d0f12'%3Erx%3C/text%3E%3C/svg%3E">
  <!-- Start downloading the app right away, not after index.js asks for it. -->
  <link rel="preload" href="index.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts don't block the first paint: system fonts until they arrive. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <script>
    // The saved theme before anything is drawn (no flash of the wrong one).
    try { const t = localStorage.getItem("rx-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* ---- tokens ---- */
    :root {
      --bg: #faf8f4; --surface: #ffffff; --surface-2: #f2efe8; --border: #e4dfd4; --border-strong: #cfc8b8;
      --text: #1b1a17; --muted: #6b675e; --faint: #9a958a;
      --accent: #b45309; --accent-soft: rgb(180 83 9 / 0.1); --on-accent: #ffffff;
      --ok: #15803d; --code-bg: #f4f1ea;
      --tok-kw: #a626a4; --tok-type: #0e7490; --tok-str: #15803d; --tok-num: #b45309; --tok-com: #9a958a; --tok-fn: #1d4ed8; --tok-pp: #be123c;
      --shadow: 0 1px 2px rgb(27 26 23 / 0.06), 0 8px 24px rgb(27 26 23 / 0.06);
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 10px; --header: 60px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0d0f12; --surface: #14171c; --surface-2: #1a1e24; --border: #252a32; --border-strong: #353b45;
      --text: #ebe7df; --muted: #9a978f; --faint: #6c6a64;
      --accent: #f5a524; --accent-soft: rgb(245 165 36 / 0.12); --on-accent: #0d0f12;
      --ok: #4ade80; --code-bg: #0a0c0f;
      --tok-kw: #c792ea; --tok-type: #7fdbca; --tok-str: #a5d6a7; --tok-num: #f5a524; --tok-com: #5f6670; --tok-fn: #82aaff; --tok-pp: #ff8a80;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.35);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0f12; --surface: #14171c; --surface-2: #1a1e24; --border: #252a32; --border-strong: #353b45;
        --text: #ebe7df; --muted: #9a978f; --faint: #6c6a64;
        --accent: #f5a524; --accent-soft: rgb(245 165 36 / 0.12); --on-accent: #0d0f12;
        --ok: #4ade80; --code-bg: #0a0c0f;
        --tok-kw: #c792ea; --tok-type: #7fdbca; --tok-str: #a5d6a7; --tok-num: #f5a524; --tok-com: #5f6670; --tok-fn: #82aaff; --tok-pp: #ff8a80;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.35);
        color-scheme: dark;
      }
    }

    /* ---- base ---- */
    * { box-sizing: border-box; }
    html {
      scroll-padding-top: calc(var(--header) + 16px);
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.68 var(--sans); letter-spacing: -0.011em; }
    a { color: inherit; }
    ::selection { background: var(--accent); color: var(--on-accent); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .boot { min-height: 100vh; display: grid; place-items: center; font-family: var(--mono); color: var(--muted); }
    .boot::after { content: "_"; animation: blink 1s steps(1) infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
    .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .mono { font-family: var(--mono); }

    /* ---- header ---- */
    .header { position: sticky; top: 0; z-index: 20; height: var(--header);
              background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px);
              border-bottom: 1px solid var(--border); }
    .header .wrap { height: 100%; display: flex; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--sans); text-decoration: none; letter-spacing: -0.03em; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
                  background: var(--accent); color: var(--on-accent); font: 700 13px var(--mono); }
    .brand-cursor { color: var(--accent); animation: blink 1.1s steps(1) infinite; font-family: var(--mono); }
    .topnav { display: flex; gap: 2px; margin-left: auto; }
    .topnav a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font: 500 14px var(--sans); }
    .topnav a:hover { color: var(--text); background: var(--surface-2); }
    .topnav a.active { color: var(--accent); }
    .topnav a.active::before { content: "~/"; opacity: 0.6; font-family: var(--mono); }
    .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
                border: 1px solid var(--border); background: var(--surface); color: var(--muted); font: 15px var(--sans); }
    .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
    @media (max-width: 640px) {
      .topnav a { padding: 6px 8px; font-size: 13px; }
      .topnav .gh { display: none; }
      .brand-text { display: none; }
    }

    /* ---- buttons ---- */
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--radius);
           font: 600 14.5px var(--sans); text-decoration: none; cursor: pointer; border: 1px solid var(--border-strong);
           background: var(--surface); color: var(--text); transition: transform .12s, border-color .12s; }
    .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }

    /* ---- home ---- */
    .hero { padding: 72px 0 56px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center; }
    .eyebrow { display: inline-flex; gap: 8px; align-items: center; font: 500 13px var(--sans); color: var(--muted);
               border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; background: var(--surface); }
    .eyebrow b { color: var(--ok); font-weight: 500; font-family: var(--mono); }
    .hero h1 { font: 800 clamp(40px, 6vw, 68px)/1.08 var(--sans); letter-spacing: -0.04em; margin: 20px 0 20px; }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero .lead { font-size: 19px; color: var(--muted); max-width: 34ch; margin: 0 0 32px; }
    .demo-pair { display: grid; gap: 14px; min-width: 0; }
    .outputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    @media (max-width: 560px) { .outputs { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
    .panel-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border);
                 font: 500 12px var(--mono); color: var(--muted); background: var(--surface-2); }
    .dots { display: flex; gap: 6px; margin-right: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
    .panel-bar .tag { margin-left: auto; color: var(--faint); }
    .browser-view { padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .browser-view .count { font: 700 56px/1 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .browser-view .hint { font-size: 13px; color: var(--muted); }
    .term-view { margin: 0; padding: 18px 20px; background: var(--code-bg); font: 14px/1.45 var(--mono); color: var(--text); overflow-x: auto; }
    .term-view .c-acc { color: var(--accent); }
    .term-view .c-dim { color: var(--faint); }
    .term-view .c-inv { background: var(--accent); color: var(--on-accent); }
    .section { padding: 56px 0; border-top: 1px solid var(--border); }
    .section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
    .section-head h2 { font: 700 28px/1.2 var(--sans); letter-spacing: -0.03em; margin: 0; }
    .section-head span { color: var(--muted); }
    .features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border);
                border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .feature { background: var(--surface); padding: 24px; display: flex; flex-direction: column; gap: 8px; }
    .feature b { font: 700 16px var(--sans); letter-spacing: -0.015em; }
    .feature b::before { content: "┌ "; color: var(--accent); font-family: var(--mono); }
    .feature p { margin: 0; color: var(--muted); font-size: 15px; }
    .feature code { font: 13px var(--mono); color: var(--text); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
    .steps { display: flex; flex-direction: column; gap: 14px; counter-reset: step; }
    .step { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr); gap: 32px; align-items: center;
            padding: 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .step > div { display: flex; flex-direction: column; gap: 8px; }
    .step h3 { margin: 0; font: 700 17px var(--sans); letter-spacing: -0.02em; display: flex; gap: 10px; align-items: center; }
    .step h3::before { counter-increment: step; content: counter(step); display: grid; place-items: center; width: 26px; height: 26px;
                       border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 13px var(--sans); }
    .step p { margin: 0; color: var(--muted); font-size: 15px; }
    .cta { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding: 32px;
           border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .cta h2 { margin: 0; font: 700 24px var(--sans); letter-spacing: -0.02em; }
    .cta p { margin: 4px 0 0; color: var(--muted); }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; padding: 40px 0; gap: 36px; }
      .features, .step { grid-template-columns: 1fr; }
      .step { gap: 16px; }
    }

    /* ---- code ---- */
    .code { border: 1px solid var(--border); border-radius: var(--radius); background: var(--code-bg); overflow: hidden; margin: 0; }
    .code-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px;
                border-bottom: 1px solid var(--border); font: 500 12px var(--mono); color: var(--faint); }
    .copy { position: relative; border: 0; background: none; cursor: pointer; color: var(--muted); font: 500 12px var(--mono);
            padding: 4px 8px; border-radius: 6px; }
    .copy:hover { color: var(--text); background: var(--surface-2); }
    .copied { position: absolute; right: 100%; top: 4px; margin-right: 6px; color: var(--ok); white-space: nowrap;
              animation: fade 1.6s forwards; pointer-events: none; }
    @keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
    .code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font: 13.5px/1.6 var(--mono); tab-size: 4; }
    .t-kw { color: var(--tok-kw); } .t-type { color: var(--tok-type); } .t-str { color: var(--tok-str); }
    .t-num { color: var(--tok-num); } .t-com { color: var(--tok-com); font-style: italic; } .t-fn { color: var(--tok-fn); }
    .t-pp { color: var(--tok-pp); } .t-prompt { color: var(--accent); user-select: none; }

    /* ---- docs ---- */
    .docs { display: grid; grid-template-columns: 240px minmax(0, 1fr) 200px; gap: 48px; align-items: start; padding: 32px 0 64px; }
    .sidebar { position: sticky; top: calc(var(--header) + 24px); max-height: calc(100vh - var(--header) - 48px); overflow-y: auto;
               display: flex; flex-direction: column; gap: 20px; padding-right: 4px;
               scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    .search { width: 100%; height: 38px; padding: 0 12px 0 32px; border-radius: 8px; border: 1px solid var(--border);
              background: var(--surface) no-repeat 11px 50%/13px; color: var(--text); font: 14px var(--sans); }
    .search-wrap { position: relative; }
    .search-wrap::before { content: "/"; position: absolute; left: 12px; top: 8px; color: var(--accent); font: 700 14px var(--mono); }
    .search:focus { outline: none; border-color: var(--accent); }
    .group-title { font: 700 11.5px var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 0 0 6px 10px; }
    .group a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14.5px;
               font-family: var(--sans); border-left: 2px solid transparent; }
    .group a:hover { color: var(--text); background: var(--surface-2); }
    .group a.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
    .nothing { color: var(--faint); font: 13px var(--sans); padding: 0 10px; }
    .menu-btn { display: none; }
    .article { min-width: 0; }
    .crumbs { font: 500 13px var(--sans); color: var(--faint); margin-bottom: 10px; }
    .crumbs a { text-decoration: none; color: var(--muted); }
    .crumbs a:hover { color: var(--accent); }
    .article h1 { font: 800 clamp(30px, 4.2vw, 42px)/1.18 var(--sans); letter-spacing: -0.035em; margin: 0 0 12px; color: var(--text); }
    .article .lead { font-size: 18px; color: var(--muted); margin: 0 0 10px; line-height: 1.55; }
    .article section { padding-top: 28px; }
    .article h2 { font: 700 22px/1.3 var(--sans); letter-spacing: -0.02em; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; color: var(--text); }
    .article h2::before { content: "#"; color: var(--accent); opacity: 0.6; font: 700 18px var(--mono); }
    .article p { margin: 0 0 14px; max-width: 72ch; line-height: 1.68; }
    .article ul { margin: 0 0 16px 0; padding-left: 0; list-style: none; max-width: 72ch; }
    .article ul li { position: relative; margin-bottom: 8px; line-height: 1.62; padding-left: 20px; }
    .article ul li::before { content: "•"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; font-size: 16px; line-height: 1.4; }
    .article code { font-family: var(--mono); font-size: 0.88em; color: var(--text); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
    .article b { font-weight: 600; color: var(--text); }
    .article .code { margin: 6px 0 12px; }
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
    .pager a { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius);
               text-decoration: none; background: var(--surface); }
    .pager a:hover { border-color: var(--accent); }
    .pager small { font: 500 12px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
    .pager b { font-weight: 600; font-family: var(--sans); }
    .pager .next { text-align: right; grid-column: 2; }
    .toc { position: sticky; top: calc(var(--header) + 24px); display: flex; flex-direction: column; gap: 2px; }
    .toc-title { font: 700 11.5px var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; }
    .toc button { text-align: left; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13.5px;
                  font-family: var(--sans); padding: 4px 0 4px 12px; border-left: 1px solid var(--border); transition: color .12s; }
    .toc button:hover { color: var(--accent); border-left-color: var(--accent); }
    .doc-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 28px; }
    .doc-card { display: flex; flex-direction: column; gap: 6px; padding: 18px; border: 1px solid var(--border); border-radius: var(--radius);
                background: var(--surface); text-decoration: none; transition: border-color .12s, transform .12s; }
    .doc-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .doc-card b { font: 700 16px var(--sans); letter-spacing: -0.015em; }
    .doc-card span { color: var(--muted); font-size: 14px; }
    .doc-card small { font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
    @media (max-width: 560px) { .code pre { font-size: 12.5px; padding: 14px; } }
    @media (max-width: 1100px) {
      .docs { grid-template-columns: 220px minmax(0, 1fr); gap: 36px; }
      .toc { display: none; }
    }
    @media (max-width: 800px) {
      .docs { grid-template-columns: 1fr; gap: 0; padding-top: 16px; }
      .menu-btn { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; width: 100%; height: 42px; padding: 0 14px;
                  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; font: 500 14px var(--sans); }
      .sidebar { position: static; max-height: none; display: none; padding: 16px 0; }
      .sidebar.open { display: flex; }
      .pager { grid-template-columns: 1fr; }
      .pager .next { grid-column: 1; }
    }

    /* ---- demos, 404, footer ---- */
    .page { padding: 48px 0 72px; }
    .page h1 { font: 800 clamp(30px, 4vw, 44px)/1.15 var(--sans); letter-spacing: -0.035em; margin: 0 0 12px; }
    .page .lead { font-size: 18px; color: var(--muted); margin: 0 0 32px; }
    .page .lead.mono { font-size: 15px; white-space: pre-line; }
    .big-404 { font: 800 clamp(80px, 16vw, 160px)/1 var(--sans); color: var(--accent); letter-spacing: -0.06em; margin: 0; }
    .footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--faint); font: 13.5px var(--sans); }
    .footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="app"><div class="boot">loading ReactX</div></div>
  {{{ SCRIPT }}}
</body>
</html>
