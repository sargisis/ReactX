<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>ReactX</title><link href=data:, rel=icon><style>:root{--bg:#f6f7fb;--card:#ffffff;--text:#1d2130;--muted:#6b7280;--accent:#2563eb;--accent-text:#ffffff;--border:#e5e7eb;--danger:#dc2626}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1117;--card:#181b24;--text:#e6e8ef;--muted:#9aa1b2;--accent:#4f8cff;--border:#2a2f3c;--danger:#f87171}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}#app{width:100%;max-width:560px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 8px 30px rgb(0 0 0 / .06)}h1{font-size:1.4rem;margin:0 0 16px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.count{font-size:3.5rem;font-weight:700;text-align:center;margin:8px 0 16px;font-variant-numeric:tabular-nums}.demo button{font:inherit;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid var(--border);background:0 0;color:var(--text)}.demo button:hover{border-color:var(--accent)}.demo button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.demo button.active{border-color:var(--accent);color:var(--accent)}.demo button.danger{color:var(--danger)}.demo button.icon{padding:2px 8px;border:none;color:var(--muted)}.demo button.icon:hover{color:var(--danger)}.demo input[type=text]{font:inherit;padding:8px 12px;border-radius:9px;width:100%;border:1px solid var(--border);background:0 0;color:var(--text)}.demo input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}.demo ul{list-style:none;padding:0;margin:16px 0}.demo li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}.demo li.done span{color:var(--muted);text-decoration:line-through}.demo li span{flex:1}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;flex-wrap:wrap;gap:8px}.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:16px 0 0}.empty{color:var(--muted);text-align:center;padding:16px 0}</style></head><body><div id=app></div><script src=https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js></script><script src=web_chart.js async></script></body></html>
